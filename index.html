<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유치원 낱말 설명 놀이 (단어 생성기)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts (Gothic A1 for clear bold Korean readability) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gothic A1', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        /* Custom Pop animation for Word Display */
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 text-gray-900 select-none">

    <!-- Top Navigation & Scoreboard Header -->
    <header class="w-full max-w-5xl flex flex-col sm:flex-row items-center justify-between gap-3 bg-white/90 backdrop-blur-md p-4 rounded-3xl border-4 border-amber-300 shadow-lg">
        <!-- App Title -->
        <div class="flex items-center gap-3">
            <span class="text-3xl sm:text-4xl">🎈</span>
            <div>
                <div class="flex items-center gap-2 flex-wrap">
                    <h1 class="text-2xl sm:text-3xl font-black text-amber-600 font-jua">알록달록 낱말 설명 놀이</h1>
                    <span class="bg-rose-500 text-white font-bold text-xs sm:text-sm px-3 py-1 rounded-full shadow">
                        1,000개+ 명사 수록
                    </span>
                </div>
                <p class="text-sky-600 font-bold text-xs sm:text-sm">어린이 맞춤형 낱말 카드 생성기</p>
            </div>
        </div>

        <!-- Scoreboard -->
        <div class="flex items-center gap-4 bg-amber-50 px-5 py-2 rounded-2xl border-2 border-amber-200">
            <div class="flex items-center gap-1.5 font-black text-emerald-600 text-lg sm:text-xl">
                <span>성공:</span>
                <span id="score-success" class="text-2xl sm:text-3xl text-emerald-700">0</span>
            </div>
            <div class="h-6 w-0.5 bg-amber-200"></div>
            <div class="flex items-center gap-1.5 font-black text-rose-500 text-lg sm:text-xl">
                <span>패스:</span>
                <span id="score-pass" class="text-2xl sm:text-3xl text-rose-600">0</span>
            </div>
            <button onclick="resetScore()" class="ml-2 text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-2 py-1 rounded-lg transition">
                초기화
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-4xl flex-1 flex flex-col items-center justify-center my-3 sm:my-6 gap-4">
        
        <!-- Controls Bar: Category & Timer Selection -->
        <div class="w-full bg-white p-3 sm:p-4 rounded-2xl border-2 border-sky-300 flex flex-wrap items-center justify-between gap-3 shadow-md">
            <!-- Category Selector -->
            <div class="flex items-center gap-2">
                <span class="font-bold text-gray-700 text-sm sm:text-base">주제 선택:</span>
                <select id="category-select" onchange="changeCategory()" class="bg-amber-100 text-amber-900 border-2 border-amber-400 font-bold rounded-xl px-3 py-1.5 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-amber-500 cursor-pointer">
                    <option value="all">🌈 전체 보기 (1000개+)</option>
                    <option value="animal">🦁 동물 & 식물</option>
                    <option value="food">🍎 음식 & 과일</option>
                    <option value="object">🎒 사물 & 학용품</option>
                    <option value="home_nature">🏡 집 & 자연 & 계절</option>
                    <option value="place_job">🏫 장소 & 탈것 & 사람</option>
                </select>
            </div>

            <!-- Timer Option -->
            <div class="flex items-center gap-2">
                <span class="font-bold text-gray-700 text-sm sm:text-base">타이머:</span>
                <div class="flex gap-1">
                    <button id="timer-btn-none" onclick="setTimerMode('none')" class="px-3 py-1 rounded-xl text-xs sm:text-sm font-bold border-2 border-amber-500 bg-amber-400 text-amber-950 shadow">무제한</button>
                    <button id="timer-btn-30" onclick="setTimerMode('30')" class="px-3 py-1 rounded-xl text-xs sm:text-sm font-bold border-2 border-gray-200 bg-gray-100 text-gray-600 hover:bg-amber-100">30초</button>
                    <button id="timer-btn-60" onclick="setTimerMode('60')" class="px-3 py-1 rounded-xl text-xs sm:text-sm font-bold border-2 border-gray-200 bg-gray-100 text-gray-600 hover:bg-amber-100">60초</button>
                </div>
            </div>
        </div>

        <!-- Timer Display Box -->
        <div id="timer-display" class="hidden text-2xl sm:text-3xl font-black text-white bg-rose-500 px-6 py-2 rounded-full shadow-lg border-2 border-white animate-pulse">
            30초
        </div>

        <!-- High-Contrast Ultra Large Word Display Card -->
        <div class="w-full bg-white rounded-3xl border-8 border-amber-400 shadow-2xl p-6 sm:p-12 flex flex-col items-center justify-center min-h-[280px] sm:min-h-[360px] relative overflow-hidden">
            
            <!-- Category Badge (Top Right) -->
            <div id="card-category-badge" class="absolute top-4 left-4 sm:top-6 sm:left-6 bg-sky-100 border-2 border-sky-400 text-sky-800 font-extrabold text-xs sm:text-base px-3 sm:px-4 py-1.5 rounded-full shadow-sm">
                주제를 선택해 주세요
            </div>

            <!-- Speech/TTS Button (Top Right) -->
            <button id="tts-btn" onclick="speakCurrentWord()" title="단어 읽어주기" class="hidden absolute top-4 right-4 sm:top-6 sm:right-6 bg-amber-400 hover:bg-amber-500 text-amber-950 border-2 border-amber-600 font-extrabold text-xs sm:text-sm px-3 sm:px-4 py-1.5 rounded-full shadow flex items-center gap-1.5 transition active:scale-95">
                🔊 <span>읽기</span>
            </button>

            <!-- Initial Start Message -->
            <div id="start-message" class="text-center">
                <p class="text-2xl sm:text-4xl font-black text-gray-800 font-jua mb-3">
                    아래 '🎲 다음 단어' 버튼을 누르면<br>단어가 나와요!
                </p>
                <p id="pool-info-text" class="text-sky-600 font-bold text-base sm:text-xl">
                    총 1,000개 이상의 명사 단어가 준비되어 있습니다.
                </p>
            </div>

            <!-- Dynamic Ultra Large Word Container -->
            <div id="word-presentation" class="hidden flex-1 flex flex-col items-center justify-center my-4">
                <h2 id="word-text" class="text-6xl sm:text-8xl md:text-9xl font-black text-gray-900 tracking-tight text-center drop-shadow-md py-2 font-jua">
                    단어
                </h2>
            </div>

            <!-- Hint Box Area -->
            <div id="hint-box" class="hidden w-full max-w-2xl mt-4 bg-amber-50 border-2 border-amber-300 rounded-2xl p-3 sm:p-4 text-center">
                <p id="hint-text" class="text-base sm:text-xl font-bold text-amber-900 leading-snug">
                    힌트 내용이 여기에 표시됩니다.
                </p>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="w-full flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 mt-2">
            <!-- Hint Button -->
            <button id="hint-btn" onclick="toggleHint()" class="w-full sm:w-auto min-w-[140px] bg-yellow-300 hover:bg-yellow-400 text-amber-950 font-black text-base sm:text-xl px-6 py-3.5 rounded-2xl border-4 border-yellow-500 shadow-md transition active:scale-95">
                💡 힌트 보기
            </button>

            <!-- Success Button -->
            <button onclick="handleSuccess()" class="w-full sm:w-1/3 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg sm:text-2xl px-6 py-3.5 rounded-2xl border-4 border-emerald-700 shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                ⭕ 정답 맞춤!
            </button>

            <!-- Pass Button -->
            <button onclick="handlePass()" class="w-full sm:w-1/3 bg-rose-500 hover:bg-rose-600 text-white font-black text-lg sm:text-2xl px-6 py-3.5 rounded-2xl border-4 border-rose-700 shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                ⏭️ 다음 (패스)
            </button>

            <!-- Next Word Button -->
            <button onclick="nextWord()" class="w-full sm:w-auto min-w-[150px] bg-sky-500 hover:bg-sky-600 text-white font-black text-lg sm:text-2xl px-6 py-3.5 rounded-2xl border-4 border-sky-700 shadow-lg transition active:scale-95">
                🎲 다음 단어
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-sky-700 font-bold text-sm sm:text-base mt-2">
        🎈 유치원 낱말 설명 놀이 | 명사 단어 1,000개+ 완비
    </footer>

                ]},
                // 5. Places, Vehicles & People Nouns (place_job)
                { cat: "place_job", catName: "장소&탈것&사람", words: [
                    "경찰차","소방차","구급차","버스","택시","자전거","킥보드","오토바이","비행기","헬리콥터","기차","지하철","배","잠수함","우주선","굴착기","트랙터","덤프트럭","레미콘","청소차","캠핑카","열기구","케이블카","썰매","유치원","학교","병원","약국","경찰서","소방서","우체국","도서관","박물관","미술관","놀이공원","놀이터","공원","동물원","식물원","수족관","수영장","영화관","마트","편의점","빵집","미용실","은행","공항","항구","기차역","주유소","세차장","주차장","캠핑장","해수욕장","우주","달나라","남극","북극","사막","밀림","시골","과수원","목장","경찰관","소방관","의사","간호사","요리사","선생님","화가","가수","마술사","농부","어부","우체부","미용사","치과의사","수의사","우주비행사","운동선수","아기","할머니","할아버지","엄마","아빠","친구","형","누나","오빠","언니","동생","이모","고모","삼촌","외삼촌","왕","왕비","왕자","공주","기사","해적","탐정","조종사","승무원","운전기사","건축가","목수","조각가","사진작가","피아니스트","바이올리니스트","지휘자","성악가","발레리나","비보이","광대","안내원","경비원","청소원","택배기사","사육사","과학자","발명가","프로그래머","게이머","유튜버","아나운서","기자","성우","배우","모델","감독","작가","디자이너","제빵사","약사","한의사","군인","선장"
                ]}
            ];

            nounBatches.forEach(batch => {
                batch.words.forEach(itemWord => {
                    if (!wordDatabase.some(e => e.word === itemWord)) {
                        wordDatabase.push({
                            word: itemWord,
                            cat: batch.cat,
                            catName: batch.catName,
                            hint: `${itemWord}(은/는) 어린이들이 잘 아는 ${batch.catName} 명사 단어예요.`
                        });
                    }
                });
            });
        })();

        // Global State Variables
        let filteredWords = [...wordDatabase];
        let currentWordObj = null;
        let scoreSuccess = 0;
        let scorePass = 0;
        let timerMode = 'none';
        let timerSeconds = 0;
        let timerInterval = null;

        // Audio Context setup
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'pass') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(200, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'hint') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.setValueAtTime(900, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch(e) {}
        }

        // Speech (TTS)
        function speakCurrentWord() {
            if (!currentWordObj) return;
            playSound('pop');

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(currentWordObj.word);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.85;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Category Filter
        function changeCategory() {
            const cat = document.getElementById('category-select').value;
            if (cat === 'all') {
                filteredWords = [...wordDatabase];
            } else {
                filteredWords = wordDatabase.filter(item => item.cat === cat);
            }

            document.getElementById('start-message').classList.remove('hidden');
            document.getElementById('word-presentation').classList.add('hidden');
            document.getElementById('tts-btn').classList.add('hidden');
            document.getElementById('card-category-badge').innerText = "주제를 선택해 주세요";
            
            document.getElementById('pool-info-text').innerText = `선택한 주제에 ${filteredWords.length}개의 명사 단어가 있어요!`;
            playSound('pop');
        }

        // Timer Control
        function setTimerMode(mode) {
            timerMode = mode;
            playSound('pop');

            ['none', '30', '60'].forEach(m => {
                const btn = document.getElementById(`timer-btn-${m}`);
                if (m === mode) {
                    btn.className = "px-3 py-1 rounded-xl text-xs sm:text-sm font-bold border-2 border-amber-500 bg-amber-400 text-amber-950 shadow";
                } else {
                    btn.className = "px-3 py-1 rounded-xl text-xs sm:text-sm font-bold border-2 border-gray-200 bg-gray-100 text-gray-600 hover:bg-amber-100";
                }
            });

            const display = document.getElementById('timer-display');
            if (mode === 'none') {
                display.classList.add('hidden');
                stopTimer();
            } else {
                display.classList.remove('hidden');
                display.innerText = `${mode}초`;
                if (currentWordObj) startTimer(parseInt(mode));
            }
        }

        function startTimer(seconds) {
            stopTimer();
            timerSeconds = seconds;
            const display = document.getElementById('timer-display');
            display.innerText = `${timerSeconds}초`;
            display.classList.remove('bg-gray-500');
            display.classList.add('bg-rose-500');

            timerInterval = setInterval(() => {
                timerSeconds--;
                if (timerSeconds <= 0) {
                    stopTimer();
                    display.innerText = "시간 끝!";
                    playSound('pass');
                } else {
                    display.innerText = `${timerSeconds}초`;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Next Word
        function nextWord() {
            if (filteredWords.length === 0) return;

            playSound('pop');

            const randomIndex = Math.floor(Math.random() * filteredWords.length);
            currentWordObj = filteredWords[randomIndex];

            document.getElementById('start-message').classList.add('hidden');
            const presentation = document.getElementById('word-presentation');
            presentation.classList.remove('hidden');
            document.getElementById('tts-btn').classList.remove('hidden');

            presentation.classList.remove('animate-pop');
            void presentation.offsetWidth;
            presentation.classList.add('animate-pop');

            document.getElementById('word-text').innerText = currentWordObj.word;
            document.getElementById('card-category-badge').innerText = `🏷️ ${currentWordObj.catName}`;
            
            const hintBox = document.getElementById('hint-box');
            const hintBtn = document.getElementById('hint-btn');
            hintBox.classList.add('hidden');
            hintBtn.innerText = "💡 힌트 보기";
            document.getElementById('hint-text').innerText = currentWordObj.hint;

            if (timerMode !== 'none') {
                startTimer(parseInt(timerMode));
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const hintBtn = document.getElementById('hint-btn');
            
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtn.innerText = "💡 힌트 닫기";
                playSound('hint');
            } else {
                hintBox.classList.add('hidden');
                hintBtn.innerText = "💡 힌트 보기";
                playSound('pop');
            }
        }

        function handleSuccess() {
            if (!currentWordObj) {
                nextWord();
                return;
            }
            scoreSuccess++;
            document.getElementById('score-success').innerText = scoreSuccess;
            playSound('correct');

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 90,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
            nextWord();
        }

        function handlePass() {
            if (!currentWordObj) {
                nextWord();
                return;
            }
            scorePass++;
            document.getElementById('score-pass').innerText = scorePass;
            playSound('pass');
            nextWord();
        }

        function resetScore() {
            scoreSuccess = 0;
            scorePass = 0;
            document.getElementById('score-success').innerText = '0';
            document.getElementById('score-pass').innerText = '0';
            playSound('pop');
        }
