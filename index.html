<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알록달록 낱말 설명 놀이 🎈</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Gaegu & Jua -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #F0F9FF;
            background-image: radial-gradient(#E0F2FE 2px, transparent 2px);
            background-size: 24px 24px;
        }

        .font-hand {
            font-family: 'Gaegu', cursive;
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-3%); }
            50% { transform: translateY(3%); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2.5s infinite ease-in-out;
        }

        @keyframes pop-in {
            0% { transform: scale(0.6); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop-in 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .card-shadow {
            box-shadow: 0 12px 0 0 #FCD34D, 0 15px 25px rgba(0,0,0,0.1);
        }
        
        .btn-shadow {
            box-shadow: 0 6px 0 0 rgba(0,0,0,0.15);
        }
        .btn-shadow:active {
            box-shadow: 0 2px 0 0 rgba(0,0,0,0.15);
            transform: translateY(4px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-6 text-gray-800 select-none">

    <!-- Top Navigation Header -->

        <!-- Title & Badge -->

            <span class="text-4xl sm:text-5xl animate-bounce-slow">🎈</span>
            <div>

                    </span>
                </div>
                <p class="text-sky-500 font-hand font-bold text-base sm:text-lg">친구들에게 멋지게 단어를 설명해 봐요!</p>
            </div>
        </div>

        <!-- Scoreboard -->
        <div class="flex items-center gap-4 bg-white px-5 py-2.5 rounded-full border-4 border-yellow-300 shadow-md">
            <div class="flex items-center gap-1.5 text-emerald-500 font-bold text-xl sm:text-2xl">
                <span>⭕ 성공:</span>
                <span id="score-success" class="text-2xl sm:text-3xl text-emerald-600">0</span>
            </div>
            <div class="h-6 w-0.5 bg-gray-200"></div>
            <div class="flex items-center gap-1.5 text-rose-400 font-bold text-xl sm:text-2xl">
                <span>⏭️ 패스:</span>
                <span id="score-pass" class="text-2xl sm:text-3xl text-rose-500">0</span>
            </div>
            <button onclick="resetScore()" title="점수 리셋" class="ml-1 text-gray-400 hover:text-gray-600 text-sm underline font-hand">
                초기화
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-4xl flex-1 flex flex-col items-center justify-center gap-4">
        
        <!-- Controls Bar: Category & Timer Setup -->
        <div class="w-full bg-white/90 backdrop-blur-sm p-3 sm:p-4 rounded-3xl border-2 border-sky-200 flex flex-wrap items-center justify-between gap-3 shadow-sm">
            <!-- Category Selection -->
            <div class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
                <span class="text-gray-700 font-bold shrink-0 text-base">📁 주제:</span>
                <select id="category-select" onchange="changeCategory()" class="bg-amber-100 text-amber-950 border-2 border-amber-300 font-bold rounded-2xl px-3 py-1.5 text-base sm:text-lg focus:outline-none focus:ring-2 focus:ring-amber-400 cursor-pointer">
                    <option value="all">🌈 전체 보기 (310개+)</option>
                    <option value="animal">🦁 동물 (65개)</option>
                    <option value="food">🍎 과일 & 음식 (65개)</option>
                    <option value="vehicle">🚗 탈것 & 교통 (55개)</option>
                    <option value="object">🎒 사물 & 자연 (75개)</option>
                    <option value="job_action">👮 직업 & 행동 (50개)</option>
                </select>
            </div>

            <!-- Timer Option & Display -->
            <div class="flex items-center justify-between sm:justify-end gap-3 w-full sm:w-auto">
                <div class="flex items-center gap-1">
                    <span class="text-gray-700 font-bold text-base">⏱️ 시간:</span>
                    <button onclick="setTimerMode('none')" id="timer-btn-none" class="px-3 py-1 rounded-xl text-sm font-bold border-2 border-amber-500 bg-amber-400 text-amber-950">무제한</button>
                    <button onclick="setTimerMode(30)" id="timer-btn-30" class="px-3 py-1 rounded-xl text-sm font-bold border-2 border-gray-200 bg-gray-100 text-gray-600">30초</button>
                    <button onclick="setTimerMode(60)" id="timer-btn-60" class="px-3 py-1 rounded-xl text-sm font-bold border-2 border-gray-200 bg-gray-100 text-gray-600">60초</button>
                </div>
                <!-- Countdown Display Badge -->
                <div id="timer-display" class="hidden bg-rose-500 text-white font-bold text-xl px-3 py-1 rounded-2xl animate-pulse min-w-[65px] text-center shadow">
                    60초
                </div>
            </div>
        </div>

        <!-- Word Card Container -->
        <div id="card-container" class="w-full bg-white border-8 border-yellow-300 rounded-3xl p-6 sm:p-10 text-center flex flex-col items-center justify-center min-h-[340px] sm:min-h-[400px] relative transition-all card-shadow">
            
            <!-- Category Tag Badge -->
            <span id="card-category-badge" class="absolute top-4 left-4 bg-sky-100 text-sky-700 text-sm font-bold px-3.5 py-1 rounded-full border border-sky-300">
                알록달록 낱말카드
            </span>

            <!-- Read Aloud Speech Button (Top Right) -->
            <button id="tts-btn" onclick="speakCurrentWord()" class="hidden absolute top-4 right-4 bg-amber-100 hover:bg-amber-200 text-amber-800 p-2.5 rounded-full border border-amber-300 shadow-sm transition-transform active:scale-95" title="음성으로 단어 듣기">

            <!-- Start State Message -->

                <span class="text-7xl sm:text-8xl animate-bounce">🎁</span>
                <p class="text-2xl sm:text-4xl font-bold text-gray-700">아래 '🎲 다음 단어' 버튼을<br>눌러주세요!</p>
                <p id="pool-info-text" class="text-sky-600 font-hand text-2xl font-bold mt-1">총 310개 이상의 재미있는 단어가 기다리고 있어요!</p>
            </div>

            <!-- Word Presentation (Hidden initially) -->
            <div id="word-presentation" class="hidden flex flex-col items-center justify-center gap-3 w-full">
                <!-- Emoji Illustration -->
                <div id="word-emoji" class="text-7xl sm:text-8xl md:text-9xl filter drop-shadow-md transition-transform hover:scale-110">
                    🐱
                </div>
                <!-- Main Word Text -->

                    고양이
                </h2>

                    <p class="text-amber-800 text-lg sm:text-xl font-bold flex items-center justify-center gap-2">
                        <span>💡 힌트:</span>
                        <span id="hint-text" class="font-hand text-xl sm:text-2xl text-amber-900">야옹야옹 울고 쥐를 잡아요!</span>
                    </p>
                </div>

                    💡 힌트 보기
                </button>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="w-full flex flex-col sm:flex-row items-center justify-center gap-3 mt-2">
            <!-- Pass Button -->
            <button onclick="handlePass()" class="w-full sm:w-1/4 bg-rose-400 hover:bg-rose-500 text-white font-bold text-xl sm:text-2xl py-3.5 px-4 rounded-2xl btn-shadow transition-all flex items-center justify-center gap-2">
                <span>⏭️</span> Pass (통과)
            </button>

            <!-- Next Random Word Button -->
            <button onclick="nextWord()" class="w-full sm:w-2/4 bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold text-2xl sm:text-3xl py-4 px-6 rounded-2xl btn-shadow transition-all flex items-center justify-center gap-2 border-2 border-amber-300">
                <span>🎲</span> 다음 단어 뽑기!
            </button>

            <!-- Success / Correct Button -->
            <button onclick="handleSuccess()" class="w-full sm:w-1/4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xl sm:text-2xl py-3.5 px-4 rounded-2xl btn-shadow transition-all flex items-center justify-center gap-2">
                <span>✅</span> 맞췄어요!
            </button>
        </div>

    </main>

    <!-- Footer Footer Information -->
    <footer class="mt-6 text-center text-sky-600 font-hand text-lg">
        🎈 선생님, 아이들과 즐겁고 행복한 낱말 맞추기 놀이 되세요!
    </footer>

            { word: "악수하기", emoji: "🤝", cat: "job_action", catName: "직업&행동", hint: "(동작) 처음 만난 친구와 손을 잡고 흔들어요." },
            { word: "안아주기", emoji: "🫂", cat: "job_action", catName: "직업&행동", hint: "(동작) 두 팔을 벌려 친구나 엄마를 꼭 감싸줘요." },
            { word: "사랑해 하기", emoji: "🫶", cat: "job_action", catName: "직업&행동", hint: "(동작) 두 손으로 머리 위나 가슴에 하트를 만들어요." }
        ];

        // Global State Variables
        let filteredWords = [...wordDatabase];
        let currentWordObj = null;
        let scoreSuccess = 0;
        let scorePass = 0;
        let timerMode = 'none'; // 'none', 30, 60
        let timerSeconds = 0;
        let timerInterval = null;

        // Web Audio API Context setup for simple UI Sound FX
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        // Play procedural Sound Effect (No external files needed)
        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'pop') { // Next / Draw sound
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'correct') { // Success sound
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'pass') { // Pass sound
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(200, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'hint') { // Hint sound
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.setValueAtTime(900, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // Web Speech API for TTS Word Reading
        function speakCurrentWord() {
            if (!currentWordObj) return;
            playSound('pop');

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(currentWordObj.word);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.85; // Slightly slower speed for kids
                utterance.pitch = 1.1;  // Slightly friendly higher pitch
                window.speechSynthesis.speak(utterance);
            } else {
                alert("이 브라우저는 음성 읽기 기능을 지원하지 않아요.");
            }
        }

        // Category Filter Change Event Handler
        function changeCategory() {
            const cat = document.getElementById('category-select').value;
            if (cat === 'all') {
                filteredWords = [...wordDatabase];
            } else {
                filteredWords = wordDatabase.filter(item => item.cat === cat);
            }

            // Reset current word view
            document.getElementById('start-message').classList.remove('hidden');
            document.getElementById('word-presentation').classList.add('hidden');
            document.getElementById('tts-btn').classList.add('hidden');
            
            // Update Text Badge & Info
            document.getElementById('pool-info-text').innerText = `선택한 주제에 ${filteredWords.length}개의 단어가 있어요!`;
            playSound('pop');
        }

        // Timer Setup Mode Handler
        function setTimerMode(mode) {
            timerMode = mode;
            playSound('pop');

            // Reset UI Buttons
            ['none', 30, 60].forEach(m => {
                const btn = document.getElementById(`timer-btn-${m}`);
                if (m === mode) {
                    btn.className = "px-3 py-1 rounded-xl text-sm font-bold border-2 border-amber-500 bg-amber-400 text-amber-950 shadow";
                } else {
                    btn.className = "px-3 py-1 rounded-xl text-sm font-bold border-2 border-gray-200 bg-gray-100 text-gray-600";
                }
            });

            const display = document.getElementById('timer-display');
            if (mode === 'none') {
                display.classList.add('hidden');
                stopTimer();
            } else {
                display.classList.remove('hidden');
                display.innerText = `${mode}초`;
                if (currentWordObj) {
                    startTimer(mode);
                }
            }
        }

        // Timer Start Logic
        function startTimer(seconds) {
            stopTimer();
            timerSeconds = seconds;
            const display = document.getElementById('timer-display');
            display.innerText = `${timerSeconds}초`;
            display.classList.remove('bg-gray-500', 'animate-ping');
            display.classList.add('bg-rose-500');

            timerInterval = setInterval(() => {
                timerSeconds--;
                if (timerSeconds <= 0) {
                    stopTimer();
                    display.innerText = "시간 끝!";
                    playSound('pass');
                } else {
                    display.innerText = `${timerSeconds}초`;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Next Word Draw Action
        function nextWord() {
            if (filteredWords.length === 0) return;

            playSound('pop');

            // Pick a random word from filtered pool
            const randomIndex = Math.floor(Math.random() * filteredWords.length);
            currentWordObj = filteredWords[randomIndex];

            // Hide Start view, Show presentation view
            document.getElementById('start-message').classList.add('hidden');
            const presentation = document.getElementById('word-presentation');
            presentation.classList.remove('hidden');
            document.getElementById('tts-btn').classList.remove('hidden');

            // Animation re-trigger
            presentation.classList.remove('animate-pop');
            void presentation.offsetWidth; // Trigger reflow
            presentation.classList.add('animate-pop');

            // Update Word UI Elements
            document.getElementById('word-emoji').innerText = currentWordObj.emoji;
            document.getElementById('word-text').innerText = currentWordObj.word;
            document.getElementById('card-category-badge').innerText = `🏷️ ${currentWordObj.catName}`;
            
            // Reset Hint UI
            const hintBox = document.getElementById('hint-box');
            const hintBtn = document.getElementById('hint-btn');
            hintBox.classList.add('hidden');
            hintBtn.innerText = "💡 힌트 보기";
            document.getElementById('hint-text').innerText = currentWordObj.hint;

            // Timer start if mode enabled
            if (timerMode !== 'none') {
                startTimer(parseInt(timerMode));
            }
        }

        // Toggle Hint Display
        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const hintBtn = document.getElementById('hint-btn');
            
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtn.innerText = "💡 힌트 닫기";
                playSound('hint');
            } else {
                hintBox.classList.add('hidden');
                hintBtn.innerText = "💡 힌트 보기";
                playSound('pop');
            }
        }

        // Handle Correct/Success Response
        function handleSuccess() {
            if (!currentWordObj) {
                nextWord();
                return;
            }

            scoreSuccess++;
            document.getElementById('score-success').innerText = scoreSuccess;
            playSound('correct');

            // Trigger Confetti Party Animation
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Immediately load next word
            nextWord();
        }

        // Handle Pass Response
        function handlePass() {
            if (!currentWordObj) {
                nextWord();
                return;
            }

            scorePass++;
            document.getElementById('score-pass').innerText = scorePass;
            playSound('pass');

            // Load next word
            nextWord();
        }

        // Reset Scoreboard Counters
        function resetScore() {
            scoreSuccess = 0;
            scorePass = 0;
            document.getElementById('score-success').innerText = '0';
            document.getElementById('score-pass').innerText = '0';
            playSound('pop');
        }
