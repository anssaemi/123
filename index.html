<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알록달록 낱말 설명 놀이 🎈</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Gaegu & Jua -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #F0F9FF;
            background-image: radial-gradient(#E0F2FE 2px, transparent 2px);
            background-size: 24px 24px;
        }

        .font-hand {
            font-family: 'Gaegu', cursive;
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-3%); }
            50% { transform: translateY(3%); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2.5s infinite ease-in-out;
        }

        @keyframes pop-in {
            0% { transform: scale(0.6); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: pop-in 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .card-shadow {
            box-shadow: 0 12px 0 0 #FCD34D, 0 15px 25px rgba(0,0,0,0.1);
        }
        
        .btn-shadow {
            box-shadow: 0 6px 0 0 rgba(0,0,0,0.15);
        }
        .btn-shadow:active {
            box-shadow: 0 2px 0 0 rgba(0,0,0,0.15);
            transform: translateY(4px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-6 text-gray-800 select-none">

    <!-- Top Navigation Header -->

        <!-- Title & Badge -->

            <span class="text-4xl sm:text-5xl animate-bounce-slow">🎈</span>
            <div>
                <div class="flex items-center gap-2 flex-wrap">

                    <span id="total-badge" class="bg-rose-500 text-white font-bold text-xs sm:text-sm px-3 py-1 rounded-full shadow-md animate-pulse">
                        총 310개+ 단어 수록!
                    </span>
                </div>
                <p class="text-sky-500 font-hand font-bold text-base sm:text-lg">친구들에게 멋지게 단어를 설명해 봐요!</p>
            </div>
        </div>

        <!-- Scoreboard -->
        <div class="flex items-center gap-4 bg-white px-5 py-2.5 rounded-full border-4 border-yellow-300 shadow-md">
            <div class="flex items-center gap-1.5 text-emerald-500 font-bold text-xl sm:text-2xl">
                <span>⭕ 성공:</span>
                <span id="score-success" class="text-2xl sm:text-3xl text-emerald-600">0</span>
            </div>
            <div class="h-6 w-0.5 bg-gray-200"></div>
            <div class="flex items-center gap-1.5 text-rose-400 font-bold text-xl sm:text-2xl">
                <span>⏭️ 패스:</span>
                <span id="score-pass" class="text-2xl sm:text-3xl text-rose-500">0</span>
            </div>
            <button onclick="resetScore()" title="점수 리셋" class="ml-1 text-gray-400 hover:text-gray-600 text-sm underline font-hand">
                초기화
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-4xl flex-1 flex flex-col items-center justify-center gap-4">
        
        <!-- Controls Bar: Category & Timer Setup -->
        <div class="w-full bg-white/90 backdrop-blur-sm p-3 sm:p-4 rounded-3xl border-2 border-sky-200 flex flex-wrap items-center justify-between gap-3 shadow-sm">
            <!-- Category Selection -->
            <div class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
                <span class="text-gray-700 font-bold shrink-0 text-base">📁 주제:</span>
                <select id="category-select" onchange="changeCategory()" class="bg-amber-100 text-amber-950 border-2 border-amber-300 font-bold rounded-2xl px-3 py-1.5 text-base sm:text-lg focus:outline-none focus:ring-2 focus:ring-amber-400 cursor-pointer">
                    <option value="all">🌈 전체 보기 (310개+)</option>
                    <option value="animal">🦁 동물 (65개)</option>
                    <option value="food">🍎 과일 & 음식 (65개)</option>
                    <option value="vehicle">🚗 탈것 & 교통 (55개)</option>
                    <option value="object">🎒 사물 & 자연 (75개)</option>
                    <option value="job_action">👮 직업 & 행동 (50개)</option>
                </select>
            </div>

            <!-- Timer Option & Display -->
            <div class="flex items-center justify-between sm:justify-end gap-3 w-full sm:w-auto">
                <div class="flex items-center gap-1">
                    <span class="text-gray-700 font-bold text-base">⏱️ 시간:</span>
                    <button onclick="setTimerMode('none')" id="timer-btn-none" class="px-3 py-1 rounded-xl text-sm font-bold border-2 border-amber-500 bg-amber-400 text-amber-950">무제한</button>
                    <button onclick="setTimerMode(30)" id="timer-btn-30" class="px-3 py-1 rounded-xl text-sm font-bold border-2 border-gray-200 bg-gray-100 text-gray-600">30초</button>
                    <button onclick="setTimerMode(60)" id="timer-btn-60" class="px-3 py-1 rounded-xl text-sm font-bold border-2 border-gray-200 bg-gray-100 text-gray-600">60초</button>
                </div>
                <!-- Countdown Display Badge -->
                <div id="timer-display" class="hidden bg-rose-500 text-white font-bold text-xl px-3 py-1 rounded-2xl animate-pulse min-w-[65px] text-center shadow">
                    60초
                </div>
            </div>
        </div>

        <!-- Word Card Container -->
        <div id="card-container" class="w-full bg-white border-8 border-yellow-300 rounded-3xl p-6 sm:p-12 text-center flex flex-col items-center justify-center min-h-[340px] sm:min-h-[420px] relative transition-all card-shadow">
            
            <!-- Category Tag Badge -->
            <span id="card-category-badge" class="absolute top-4 left-4 bg-sky-100 text-sky-700 text-sm sm:text-base font-bold px-4 py-1.5 rounded-full border border-sky-300">
                알록달록 낱말카드
            </span>

            <!-- Read Aloud Speech Button (Top Right) -->
            <button id="tts-btn" onclick="speakCurrentWord()" class="hidden absolute top-4 right-4 bg-amber-100 hover:bg-amber-200 text-amber-800 p-2.5 sm:px-4 sm:py-2 rounded-full border border-amber-300 shadow-sm transition-transform active:scale-95 flex items-center gap-1.5" title="음성으로 단어 듣기">
                <span class="text-xl">🔊</span> <span class="text-sm font-bold">소리 듣기</span>
            </button>

            <!-- Start State Message -->
            <div id="start-message" class="flex flex-col items-center gap-4">
                <p class="text-3xl sm:text-5xl font-black text-gray-700 leading-tight">아래 '🎲 다음 단어' 버튼을<br>눌러주세요!</p>

            </div>

            <div id="word-presentation" class="hidden flex flex-col items-center justify-center gap-4 w-full py-4">

                <h2 id="word-text" class="text-6xl sm:text-8xl md:text-9xl font-black text-gray-900 tracking-wider my-4 drop-shadow-sm leading-none">
                    사과
                </h2>

                <!-- Hint Container -->

                        <span>💡 힌트:</span>
                        <span id="hint-text" class="font-hand text-2xl sm:text-3xl text-amber-950">빨갛고 아삭아삭 맛있는 과일이에요.</span>
                    </p>
                </div>

                <button id="hint-btn" onclick="toggleHint()" class="mt-2 bg-yellow-100 hover:bg-yellow-200 text-yellow-900 text-lg sm:text-xl font-bold px-5 py-2 rounded-full border border-yellow-400 transition-colors">
                    💡 힌트 보기
                </button>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="w-full flex flex-col sm:flex-row items-center justify-center gap-3 mt-2">
            <!-- Pass Button -->
            <button onclick="handlePass()" class="w-full sm:w-1/4 bg-rose-400 hover:bg-rose-500 text-white font-bold text-xl sm:text-2xl py-4 px-4 rounded-2xl btn-shadow transition-all flex items-center justify-center gap-2">
                <span>❌</span> 패스 (Pass)
            </button>

            <!-- Next Random Word Button -->
            <button onclick="nextWord()" class="w-full sm:w-2/4 bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold text-2xl sm:text-3xl py-4 px-6 rounded-2xl btn-shadow transition-all flex items-center justify-center gap-2 border-2 border-amber-300">
                <span>🎲</span> 다음 단어 뽑기!
            </button>

            <!-- Success / Correct Button -->
            <button onclick="handleSuccess()" class="w-full sm:w-1/4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xl sm:text-2xl py-4 px-4 rounded-2xl btn-shadow transition-all flex items-center justify-center gap-2">
                <span>⭕</span> 맞췄어요!
            </button>
        </div>

    </main>

    <!-- Footer Information -->

        🎈 명사 단어 500개 수록 | 유치원 낱말 설명 놀이 
    </footer>

            { word: "눈사람", cat: "place_vehicle", catName: "탈것&장소", hint: "눈을 굴려서 동그랗게 쌓아 만든 친구!" },
            { word: "바람", cat: "place_vehicle", catName: "탈것&장소", hint: "눈에는 안 보이지만 잎을 흔들리게 해요." },
            { word: "번개", cat: "place_vehicle", catName: "탈것&장소", hint: "우르르 쾅! 하늘이 번쩍 빛나는 현상!" },
            { word: "산", cat: "place_vehicle", catName: "탈것&장소", hint: "나무와 바위가 높게 솟아 올라있는 자연!" },
            { word: "바다", cat: "place_vehicle", catName: "탈것&장소", hint: "파도가 둥둥 치고 넓고 파란 물밭!" },
            { word: "강", cat: "place_vehicle", catName: "탈것&장소", hint: "물고기가 헤엄치며 시원하게 흐르는 물길!" },
            { word: "돌(바위)", cat: "place_vehicle", catName: "탈것&장소", hint: "땅에 단단하게 굳어있는 만지면 딱딱한 것!" },
            { word: "흙", cat: "place_vehicle", catName: "탈것&장소", hint: "식물이 뿌리를 내리고 자라나는 갈색 땅!" }
        ];

        // Global State Variables
        let filteredWords = [...wordDatabase];
        let currentWordObj = null;
        let scoreSuccess = 0;
        let scorePass = 0;
        let timerMode = 'none'; // 'none', 30, 60
        let timerSeconds = 0;
        let timerInterval = null;

        // Web Audio API Context setup for simple UI Sound FX
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        // Sound Effects
        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    osc.frequency.setValueAtTime(1046.50, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'pass') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(200, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'hint') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.setValueAtTime(900, now + 0.08);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // Web Speech API for TTS Word Reading
        function speakCurrentWord() {
            if (!currentWordObj) return;
            playSound('pop');

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(currentWordObj.word);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.85;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("이 브라우저는 음성 읽기 기능을 지원하지 않아요.");
            }
        }

        // Category Selection
        function changeCategory() {
            const cat = document.getElementById('category-select').value;
            if (cat === 'all') {
                filteredWords = [...wordDatabase];
            } else {
                filteredWords = wordDatabase.filter(item => item.cat === cat);
            }

            document.getElementById('start-message').classList.remove('hidden');
            document.getElementById('word-presentation').classList.add('hidden');
            document.getElementById('tts-btn').classList.add('hidden');
            
            document.getElementById('pool-info-text').innerText = `선택한 주제에 ${filteredWords.length}개의 명사 단어가 있어요!`;
            playSound('pop');
        }

        // Timer Control
        function setTimerMode(mode) {
            timerMode = mode;
            playSound('pop');

            ['none', 30, 60].forEach(m => {
                const btn = document.getElementById(`timer-btn-${m}`);
                if (m === mode) {
                    btn.className = "px-3 py-1 rounded-xl text-sm font-bold border-2 border-amber-500 bg-amber-400 text-amber-950 shadow";
                } else {
                    btn.className = "px-3 py-1 rounded-xl text-sm font-bold border-2 border-gray-200 bg-gray-100 text-gray-600";
                }
            });

            const display = document.getElementById('timer-display');
            if (mode === 'none') {
                display.classList.add('hidden');
                stopTimer();
            } else {
                display.classList.remove('hidden');
                display.innerText = `${mode}초`;
                if (currentWordObj) {
                    startTimer(mode);
                }
            }
        }

        function startTimer(seconds) {
            stopTimer();
            timerSeconds = seconds;
            const display = document.getElementById('timer-display');
            display.innerText = `${timerSeconds}초`;
            display.classList.remove('bg-gray-500');
            display.classList.add('bg-rose-500');

            timerInterval = setInterval(() => {
                timerSeconds--;
                if (timerSeconds <= 0) {
                    stopTimer();
                    display.innerText = "시간 끝!";
                    playSound('pass');
                } else {
                    display.innerText = `${timerSeconds}초`;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Next Word Generator
        function nextWord() {
            if (filteredWords.length === 0) return;

            playSound('pop');

            const randomIndex = Math.floor(Math.random() * filteredWords.length);
            currentWordObj = filteredWords[randomIndex];

            document.getElementById('start-message').classList.add('hidden');
            const presentation = document.getElementById('word-presentation');
            presentation.classList.remove('hidden');
            document.getElementById('tts-btn').classList.remove('hidden');

            presentation.classList.remove('animate-pop');
            void presentation.offsetWidth;
            presentation.classList.add('animate-pop');

            document.getElementById('word-text').innerText = currentWordObj.word;
            document.getElementById('card-category-badge').innerText = `🏷️ ${currentWordObj.catName}`;
            
            const hintBox = document.getElementById('hint-box');
            const hintBtn = document.getElementById('hint-btn');
            hintBox.classList.add('hidden');
            hintBtn.innerText = "💡 힌트 보기";
            document.getElementById('hint-text').innerText = currentWordObj.hint;

            if (timerMode !== 'none') {
                startTimer(parseInt(timerMode));
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            const hintBtn = document.getElementById('hint-btn');
            
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintBtn.innerText = "💡 힌트 닫기";
                playSound('hint');
            } else {
                hintBox.classList.add('hidden');
                hintBtn.innerText = "💡 힌트 보기";
                playSound('pop');
            }
        }

        function handleSuccess() {
            if (!currentWordObj) {
                nextWord();
                return;
            }

            scoreSuccess++;
            document.getElementById('score-success').innerText = scoreSuccess;
            playSound('correct');

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            nextWord();
        }

        function handlePass() {
            if (!currentWordObj) {
                nextWord();
                return;
            }

            scorePass++;
            document.getElementById('score-pass').innerText = scorePass;
            playSound('pass');

            nextWord();
        }

        function resetScore() {
            scoreSuccess = 0;
            scorePass = 0;
            document.getElementById('score-success').innerText = '0';
            document.getElementById('score-pass').innerText = '0';
            playSound('pop');
        }
    </script>
